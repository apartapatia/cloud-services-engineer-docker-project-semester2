global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5000
    timeout client 50000
    timeout server 50000

resolvers docker_resolvers
    nameserver dns 127.0.0.11:53

frontend http_front
    bind *:80
    
    acl is_api path_beg /api
    use_backend backend_servers if is_api
    
    default_backend frontend_servers

backend backend_servers
    balance roundrobin
    http-request set-path %[path,regsub(^/api/,/)]
    server-template backend 1-10 momo-backend:8081 check resolvers docker_resolvers init-addr none

backend frontend_servers
    balance roundrobin
    server-template frontend 1-10 momo-frontend:8080 check resolvers docker_resolvers init-addr none
